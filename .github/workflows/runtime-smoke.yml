name: Windows runtime smoke

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        shell: cmd
        run: |
          call npm ci > npm-ci-node-${{ matrix.node-version }}.log 2>&1
          set CODE=%ERRORLEVEL%
          type npm-ci-node-${{ matrix.node-version }}.log
          exit /b %CODE%

      - name: Run transactional source preparation and smoke suite
        shell: cmd
        run: |
          call npm run verify > verify-node-${{ matrix.node-version }}.log 2>&1
          set CODE=%ERRORLEVEL%
          type verify-node-${{ matrix.node-version }}.log
          exit /b %CODE%
        env:
          AEGIS_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}+runtime-ci

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-runtime-node-${{ matrix.node-version }}-${{ github.run_id }}
          path: |
            npm-ci-node-${{ matrix.node-version }}.log
            verify-node-${{ matrix.node-version }}.log
          if-no-files-found: warn

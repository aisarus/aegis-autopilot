name: Windows runtime smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'main.js'
      - 'preload.js'
      - 'chatgpt-preload.js'
      - 'adapters/**'
      - 'renderer/**'
      - 'patches/**'
      - 'scripts/update-and-run.ps1'
      - 'update-and-run.cmd'
      - 'tests/multi-chat-smoke.js'
      - 'tests/autopilot-resilience-smoke.js'
      - 'tests/send-contract-smoke.js'
      - 'tests/composer-first-readiness-smoke.js'
      - 'tests/no-reload-loop-smoke.js'
      - 'tests/budget-guard-smoke.js'
      - 'tests/minimal-three-project-smoke.js'
      - 'tests/chat-identity-draft-smoke.js'
      - 'tests/send-transaction-smoke.js'
      - 'tests/own-draft-retry-smoke.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Verify runtime patch chain and smoke suite
        shell: powershell
        env:
          AEGIS_TEST_ONLY: '1'
        run: .\scripts\update-and-run.ps1

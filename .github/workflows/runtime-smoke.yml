name: Windows runtime smoke

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-runtime-${{ github.ref }}-${{ matrix.node-version }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run transactional source preparation and smoke suite
        run: npm run verify
        env:
          AEGIS_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}+runtime-ci

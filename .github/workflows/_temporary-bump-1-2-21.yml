name: Bump acceptance version 1.2.21

on:
  push:
    branches:
      - agent/clean-acceptance-worktree

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version branch
        uses: actions/checkout@v4
        with:
          ref: agent/clean-acceptance-worktree
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update package and lockfile versions
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          if [ "$current" = "1.2.21" ]; then
            echo "Package metadata already reports 1.2.21."
            exit 0
          fi
          npm version 1.2.21 --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: identify acceptance build as 1.2.21"
          git push origin HEAD:agent/clean-acceptance-worktree

name: Aegis PR Gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: aegis-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify proposed build
        run: npm run verify
        env:
          AEGIS_BUILD_SHA: ${{ github.event.pull_request.head.sha }}+pr

      - name: Create debug bundle on failure
        if: failure()
        run: npm run debug:bundle

      - name: Upload debug bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-pr-debug-${{ github.run_id }}
          path: aegis-debug-*.txt
          if-no-files-found: ignore

name: Aegis Windows CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]

concurrency:
  group: aegis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        shell: cmd
        run: |
          call npm ci > npm-ci.log 2>&1
          set CODE=%ERRORLEVEL%
          type npm-ci.log
          exit /b %CODE%

      - name: Prepare and verify source
        shell: cmd
        run: |
          call npm run verify > verify.log 2>&1
          set CODE=%ERRORLEVEL%
          type verify.log
          exit /b %CODE%
        env:
          AEGIS_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}+ci

      - name: Create debug bundle on failure
        if: failure()
        run: npm run debug:bundle

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-ci-evidence-${{ github.run_id }}
          path: |
            npm-ci.log
            verify.log
            aegis-debug-*.txt
          if-no-files-found: warn
